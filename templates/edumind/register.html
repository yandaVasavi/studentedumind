
{% extends 'edumind/base.html' %}

{% block title %}Create Account | EduMind{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">

        <h1>Create Your Account</h1>
        <p>Join EduMind and start your learning journey.</p>

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name"
                       placeholder="Enter your first name" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name"
                       placeholder="Enter your last name" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm your password"
                       minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary auth-button">
                Create Account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>

    </div>
</section>

{% endblock %}
